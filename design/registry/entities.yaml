# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: cara_por_tirada
    status: active
    source: design/gdd/libreria-de-reglas.md
    referenced_by:
      - design/gdd/libreria-de-reglas.md
      - design/gdd/modificador.md
    variables:
      - n
      - k
      - p_i
    output_range: [1, 10]
    expression: "primera cara f tal que n < p_1 + ... + p_f; las p_i suman tirada_rango (100)"
    notes: "Salida 1..k, con k = largo de la tabla (2-10; la regla 2 exige caras de Grito y Arremetida; antes 1-10, cambiado 2026-11-19). n es la tirada inyectada (0-99). Cada p_i se valida en 0-100 antes de sumar; tabla que no suma 100 -> ProbabilidadesInvalidas en CrearPartida. La usa el Modificador (#11)."
    added: 2026-11-19
    revised: 2026-11-19
  - name: opcion_por_sorteo
    status: deprecated
    source: design/gdd/libreria-de-reglas.md
    referenced_by:
      - design/gdd/libreria-de-reglas.md
    variables:
      - n
      - k
    output_range: [0, 99]
    expression: "(n * k) / tirada_rango, division entera hacia abajo"
    notes: "RETIRADA 2026-11-25: el Tablero (#4) usa castillos fijos (par 4-6) y no hay sorteo; la Libreria quito la formula y su estado. Antes: salida 0..k-1, k = 3 daba 34/33/33, y la usaba el Tablero para el sorteo de castillos."
    added: 2026-11-19
    revised: 2026-11-25
  - name: reparto_liberado
    status: active
    source: design/gdd/libreria-de-reglas.md
    referenced_by:
      - design/gdd/libreria-de-reglas.md
      - design/gdd/reclutamiento-y-limites.md
      - design/gdd/modificador.md
    variables:
      - p_i
      - L
      - piezas_sin_rey
      - limite_normal
    output_range: [0, 100]
    expression: "L = suma de las caras de reclutar que no pueden salir (pasan a 0); p_Grito += L / 2 (division entera hacia abajo); p_Arremetida += L - L / 2; despues, si piezas_sin_rey <= limite_normal: p_Grito += p_Arremetida y p_Arremetida = 0"
    # expression was: sin el bloqueo de Arremetida (v5, 2026-11-24), before 2026-11-25
    notes: "Arma la tabla efectiva del Modificador (#11) al entrar en esperando tirada. Un solo redondeo sobre el total liberado; el punto impar va a Arremetida. Cubre solo muros y llamadas; tope y lugar van por reparto_sin_lugar (#10) y se suman. La tabla resultante siempre suma tirada_rango (100) y se valida como en CrearPartida. La funcion publica es TablaEfectiva(tablaBase, agotadas, sinLugar, piezasSinRey, limiteNormal) (Libreria, regla 10; reemplaza a RepartoLiberado); el bloqueo de Arremetida usa la Arremetida final (base + L + Q), no la base. Ejemplos con mas de 12 piezas sin el Rey: 15/20/25/25/15 con 2 muros rotos -> 15/45/0/0/40; 20/25/15/20/20 con Llamada agotada -> 20/32/0/20/28. Con 12 o menos: la primera -> 15/85/0/0/0."
    added: 2026-11-19
    revised: 2026-11-27
  - name: tope_total
    status: active
    source: design/gdd/catalogo-de-piezas.md
    referenced_by:
      - design/gdd/catalogo-de-piezas.md
      - design/gdd/cobertura-del-escudero.md
    variables:
      - topeVivas_t
      - t
    output_range: [7, 61]
    expression: "suma de topeVivas_t para t = 0 a 6"
    notes: "Regla F6 del Catalogo: la suma no puede pasar de 61 (tope_vivas_por_jugador). Valores vigentes: 12+16+12+8+8+4+1 = 61."
    added: 2026-11-20
    revised: ""
  - name: piezas_para_matar
    status: active
    source: design/gdd/catalogo-de-piezas.md
    referenced_by:
      - design/gdd/castillo-y-muros.md
      - design/gdd/catalogo-de-piezas.md
      - design/gdd/tablero-y-despliegue-inicial.md
      - design/gdd/cobertura-del-escudero.md
      - design/gdd/resolucion-simultanea-del-dano.md
    variables:
      - ataque_a
      - escudo_t
      - vida_t
    output_range: [1, 2000]
    expression: "(escudo_t + vida_t + ataque_a - 1) / ataque_a, division entera hacia abajo"
    notes: "Oraculo de tests de balance (chequeos I1 a I4 del Catalogo, que se evaluan con el bono del Grito y sin el: ver piezas_para_matar_ef); no entra al nucleo ni a la vista previa. El calculo real del dano es de Resolucion (#9)."
    added: 2026-11-20
    revised: 2026-11-27
  - name: piezas_para_matar_ef
    status: active
    source: design/gdd/catalogo-de-piezas.md
    referenced_by:
      - design/gdd/catalogo-de-piezas.md
    variables:
      - ataque_a
      - bonoGrito_a
      - escudo_t
      - vida_t
    output_range: [1, 2000]
    expression: "ceil((escudo_t + vida_t) / (ataque_a + bonoGrito_a)); bonoGrito_a = bono_grito_ataque, 0 para el demoledor (la explosion no lleva bono)"
    notes: "Version con el Grito de piezas_para_matar (decision D2 del Catalogo, 2026-11-27): I1 e I2 se evaluan con el bono y sin el. EvaluarI(catalogo, config) lee bono_grito_ataque de la config. Oraculo de tests; no entra al nucleo."
    added: 2026-11-27
    revised: ""
  - name: regla_f9
    status: active
    source: design/gdd/catalogo-de-piezas.md
    referenced_by:
      - design/gdd/catalogo-de-piezas.md
      - design/gdd/libreria-de-reglas.md
      - design/gdd/tablero-y-despliegue-inicial.md
      - design/gdd/modificador.md
    variables:
      - movimiento_t
      - bono_grito_movimiento
      - techo_movimiento
    output_range: [0, 1]
    expression: "valida si movimiento_t + bono_grito_movimiento <= techo_movimiento (12) para todo tipo t; si no, ConfigInvalida(F9)"
    notes: "Regla de forma F9 del Catalogo. checked_in: CrearPartida (no PrepararContexto, que no recibe la config; decision D5 del 2026-11-27), despues de validar los bonos del Grito (0 a 10, no los dos en 0) y antes de T4 a T6 (Libreria, regla 2). Con el bono vigente de 2 el movimiento base llega como mucho a 10. No mira el alcance: m + R <= 13 lo cubren solo los tests de balance (Open Question del Tablero y del Catalogo)."
    added: 2026-11-27
    revised: ""
  - name: chequeo_i4
    status: active
    source: design/gdd/catalogo-de-piezas.md
    referenced_by:
      - design/gdd/catalogo-de-piezas.md
      - design/gdd/resolucion-simultanea-del-dano.md
      - design/gdd/metricas-locales-de-partida.md
    variables:
      - ataque_5
      - escudo_Rey
      - vida_Rey
    output_range: [0, 1]
    expression: "regla dura: ataque_5 - escudo_Rey < vida_Rey (la explosion del demoledor nunca mata al Rey sola)"
    notes: "Chequeo I4 del Catalogo (D1 y D7, 2026-11-27): la explosion queda en 30; la excepcion admite hasta 8 muertes no-Rey por explosion, sin cota (se miden en Metricas, #19). Reemplaza la aprobacion del 2026-11-20. EvaluarI devuelve ademas la lista informativa de excepciones aprobadas (I1 e I4). Oraculo de tests; no entra al nucleo."
    added: 2026-11-27
    revised: ""
  - name: umbral_cierre_s
    status: deprecated
    source: design/gdd/maquina-de-turno.md
    referenced_by:
      - design/gdd/maquina-de-turno.md
    variables:
      - T_tope
      - turno_max_s
    output_range: [1410, 1440]
    expression: "T_tope - turno_max_s"
    notes: "REEMPLAZADA 2026-11-24 por el reloj por jugador (Maquina de turno, regla 14). Antes: D2. Desde este t_partida la autoridad cierra con CierrePorTiempo en el primer entre-turnos. Variable tras el minuto 10 = 1440 s, Fijo 90 = 1410, Fijo 60 = 1440, Sin limite exento. La usan el Timer (#12) y el Servidor (#28); no corre en el nucleo (no tiene reloj)."
