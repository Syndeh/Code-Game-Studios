# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: cara_por_tirada
    status: active
    source: design/gdd/libreria-de-reglas.md
    referenced_by:
      - design/gdd/libreria-de-reglas.md
    variables:
      - n
      - k
      - p_i
    output_range: [1, 10]
    expression: "primera cara f tal que n < p_1 + ... + p_f; las p_i suman tirada_rango (100)"
    notes: "Salida 1..k, con k = largo de la tabla (2-10; la regla 2 exige caras de Grito y Arremetida; antes 1-10, cambiado 2026-11-19). n es la tirada inyectada (0-99). Cada p_i se valida en 0-100 antes de sumar; tabla que no suma 100 -> ProbabilidadesInvalidas en CrearPartida. La usa el Modificador (#11)."
    added: 2026-11-19
    revised: 2026-11-19
  - name: opcion_por_sorteo
    status: deprecated
    source: design/gdd/libreria-de-reglas.md
    referenced_by:
      - design/gdd/libreria-de-reglas.md
    variables:
      - n
      - k
    output_range: [0, 99]
    expression: "(n * k) / tirada_rango, division entera hacia abajo"
    notes: "RETIRADA 2026-11-25: el Tablero (#4) usa castillos fijos (par 4-6) y no hay sorteo; la Libreria quito la formula y su estado. Antes: salida 0..k-1, k = 3 daba 34/33/33, y la usaba el Tablero para el sorteo de castillos."
    added: 2026-11-19
    revised: 2026-11-25
  - name: reparto_liberado
    status: active
    source: design/gdd/libreria-de-reglas.md
    referenced_by:
      - design/gdd/libreria-de-reglas.md
    variables:
      - p_i
      - L
      - piezas_sin_rey
      - limite_normal
    output_range: [0, 100]
    expression: "L = suma de las caras de reclutar que no pueden salir (pasan a 0); p_Grito += L / 2 (division entera hacia abajo); p_Arremetida += L - L / 2; despues, si piezas_sin_rey <= limite_normal: p_Grito += p_Arremetida y p_Arremetida = 0"
    # expression was: sin el bloqueo de Arremetida (v5, 2026-11-24), before 2026-11-25
    notes: "Arma la tabla efectiva del Modificador (#11) al entrar en esperando tirada. Un solo redondeo sobre el total liberado; el punto impar va a Arremetida. La tabla resultante siempre suma tirada_rango (100) y se valida como en CrearPartida. Ejemplos con mas de 12 piezas sin el Rey: 15/20/25/25/15 con 2 muros rotos -> 15/45/0/0/40; 20/25/15/20/20 con Llamada agotada -> 20/32/0/20/28. Con 12 o menos: la primera -> 15/85/0/0/0."
    added: 2026-11-19
    revised: 2026-11-25
  - name: tope_total
    status: active
    source: design/gdd/catalogo-de-piezas.md
    referenced_by:
      - design/gdd/catalogo-de-piezas.md
    variables:
      - topeVivas_t
      - t
    output_range: [7, 61]
    expression: "suma de topeVivas_t para t = 0 a 6"
    notes: "Regla F6 del Catalogo: la suma no puede pasar de 61 (tope_vivas_por_jugador). Valores vigentes: 12+16+12+8+8+4+1 = 61."
    added: 2026-11-20
    revised: ""
  - name: piezas_para_matar
    status: active
    source: design/gdd/catalogo-de-piezas.md
    referenced_by:
      - design/gdd/castillo-y-muros.md
      - design/gdd/catalogo-de-piezas.md
      - design/gdd/tablero-y-despliegue-inicial.md
    variables:
      - ataque_a
      - escudo_t
      - vida_t
    output_range: [1, 2000]
    expression: "(escudo_t + vida_t + ataque_a - 1) / ataque_a, division entera hacia abajo"
    notes: "Oraculo de tests de balance (chequeos I1 a I3 del Catalogo); no entra al nucleo ni a la vista previa. El calculo real del dano es de Resolucion (#9)."
    added: 2026-11-20
    revised: ""
  - name: umbral_cierre_s
    status: deprecated
    source: design/gdd/maquina-de-turno.md
    referenced_by:
      - design/gdd/maquina-de-turno.md
    variables:
      - T_tope
      - turno_max_s
    output_range: [1410, 1440]
    expression: "T_tope - turno_max_s"
    notes: "REEMPLAZADA 2026-11-24 por el reloj por jugador (Maquina de turno, regla 14). Antes: D2. Desde este t_partida la autoridad cierra con CierrePorTiempo en el primer entre-turnos. Variable tras el minuto 10 = 1440 s, Fijo 90 = 1410, Fijo 60 = 1440, Sin limite exento. La usan el Timer (#12) y el Servidor (#28); no corre en el nucleo (no tiene reloj)."
    added: 2026-11-20
    revised: 2026-11-25
  - name: ganador_tiempo
    status: deprecated
    source: design/gdd/maquina-de-turno.md
    referenced_by:
      - design/gdd/maquina-de-turno.md
    variables:
      - vidaRey_j
      - piezasVivas_j
      - vidaQuitada_j
    output_range: [0, 1]
    expression: "gana el jugador de mayor (vidaRey, piezasVivas, vidaQuitada) en orden lexicografico; claves iguales = sin ganador"
    notes: "REEMPLAZADA 2026-11-24 (Maquina de turno, regla 15). Antes: D3. Desempate de CierrePorTiempo (decision 2026-11-20, cambia la Libreria: vidaQuitada es un campo nuevo del estado y sube la version de reglas). vidaQuitada es la vida realmente perdida por piezas y muros rivales, sin fuego amigo, escrita por Resolucion (#9). Salida: jugador 0 o 1, o vacio."
    added: 2026-11-20
    revised: 2026-11-25
  - name: pila_max
    status: active
    source: design/gdd/maquina-de-turno.md
    referenced_by:
      - design/gdd/maquina-de-turno.md
    variables:
      - tope_vivas_t
      - movimiento_t
      - t
    output_range: [7, 256]
    expression: "suma de tope_vivas_t * movimiento_t para t = 0 a 6; invariante pila_max <= pila_tope"
    notes: "D4. Peor caso de entradas de la pila de deshacer en un turno (Arremetida, un paso por comando). Valores vigentes 48+64+48+16+48+24+6 = 254 de 256; PrepararContexto rechaza con ConfigInvalida un Catalogo que supere 256. PROVISIONAL hasta Movimiento (#6)."
    added: 2026-11-20
    revised: ""
  - name: turnos_presupuesto
    status: active
    source: design/gdd/maquina-de-turno.md
    referenced_by:
      - design/gdd/maquina-de-turno.md
    variables:
      - T_tope
      - seg_medio
    output_range: [1, 1500]
    expression: "T_tope / seg_medio, division entera hacia abajo; seg_medio minimo 1"
    notes: "D1. Cuantos turnos caben en el tope de partida (1500 s) al promedio medido por turno. v4: 57 s -> 26 turnos, 40 s -> 37. Formula de diseno que usan las Metricas (#19); no corre en el nucleo. Resolucion (#9), Reclutamiento (#10) y Modificador (#11) declaran su delta de turnos contra este presupuesto."
    added: 2026-11-20
    revised: ""
  - name: distancia_frente
    status: active
    source: design/gdd/tablero-y-despliegue-inicial.md
    referenced_by:
      - design/gdd/tablero-y-despliegue-inicial.md
    variables:
      - cc_azul
      - cc_rojo
      - RADIO_MURO
      - linea_max
    output_range: [2, 9]
    expression: "(cc_rojo - cc_azul) - 2 * (RADIO_MURO + 1 + linea_max); invariante distancia_frente >= 2"
    notes: "Distancia en casillas entre las lineas de escuderos de los dos ejercitos al empezar (9 con cc 2 y 21, RADIO_MURO 2, linea_max 2). Con 1 los ejercitos empiezan pegados. Constantes del contrato del Tablero (#4): cambiarlas sube la version de reglas."
    added: 2026-11-25
    revised: ""
  - name: turnos_hasta_contacto
    status: active
    source: design/gdd/tablero-y-despliegue-inicial.md
    referenced_by:
      - design/gdd/tablero-y-despliegue-inicial.md
    variables:
      - distancia_frente
      - m
    output_range: [1, 8]
    expression: "ceil((distancia_frente - 1) / m), cota inferior; m = movimiento de las piezas de frente, minimo 1 (Catalogo F2)"
    notes: "Oraculo de tests de balance; no entra al nucleo. Con distancia_frente 9: m=4 -> 2, m=6 -> 2, m=2 -> 4, m=1 -> 8, m=8 -> 1. Ignora bloqueos y supone avance en linea recta."
    added: 2026-11-25
    revised: ""
  - name: techo_movimiento
    status: active
    source: design/gdd/tablero-y-despliegue-inicial.md
    referenced_by:
      - design/gdd/tablero-y-despliegue-inicial.md
      - design/gdd/catalogo-de-piezas.md
    variables:
      - cc_azul
      - cc_rojo
      - RADIO_MURO
    output_range: [1, 12]
    expression: "d_anillo_muro - 1, con d_anillo_muro = (cc_rojo - RADIO_MURO - 1) - (cc_azul + RADIO_MURO + 1)"
    notes: "Techo de movimiento efectivo para que una pieza reclutada en el anillo no llegue al muro rival el mismo turno (13 pasos -> techo 12). Responde la Open Question del Catalogo sobre el techo de movimiento; supone el carril libre. Oraculo de tests de balance; no entra al nucleo."
    added: 2026-11-25
    revised: ""
